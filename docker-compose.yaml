version: '3'

services:
  db:
    image: mysql:8.0
    container_name: myjob-db-container
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/myjob_db.sql:/docker-entrypoint-initdb.d/data.sql
      - myjob-volume:/var/lib/mysql
    networks:
      - myjob-network
    ports:
      - "${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  redis:
    image: redis:alpine
    container_name: myjob-redis
    restart: unless-stopped
    command: redis-server --requirepass ${SERVICE_REDIS_PASSWORD} --port ${SERVICE_REDIS_PORT}
    networks:
      - myjob-network
    ports:
      - "${SERVICE_REDIS_PORT}:${SERVICE_REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "${SERVICE_REDIS_PORT}", "-a", "${SERVICE_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  backend:
    image: myjob-backend
    container_name: myjob-backend-container
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - myjob-network
    volumes:
      - ./:/myjob_api
    ports:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/common/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  celery-worker:
    image: myjob-backend
    container_name: myjob-celery-worker
    restart: unless-stopped
    command: celery -A myjob_api.celery worker --loglevel=info --concurrency=4
    env_file:
      - .env
    networks:
      - myjob-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: myjob-backend-nginx
    restart: always
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ssl-certs:/etc/nginx/ssl
      - ./staticfiles:/myjob_api/staticfiles
    ports:
      - "80:80"
      - "443:443"
    networks:
      - myjob-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  myjob-network:
    name: myjob-network

volumes:
  myjob-volume:
  ssl-certs: